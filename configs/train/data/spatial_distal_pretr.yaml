# Framediff-only dataset for DistalSeparatedMotifScaffolding (crop256).
#
# Requires:
#   export NOMADFLOW_DATA_FRAMEDIFF_BOLTZ=/path/to/framediff_boltz
_target_: nomadflow.data.datasets.datamodule.TrainingDataset
max_crop_residues: 128
max_crop_rigids: 768
use_cropper: true
dataset_probs: [1.0]
remove_mol_types:
  - "DNA"
  - "RNA"
  - "NONPOLYMER"
datasets:
  - _target_: nomadflow.data.datasets.dataset.MMCIFDataset
    data_dir: ENV:NOMADFLOW_DATA_FRAMEDIFF_BOLTZ
    data_sampler:
      _target_: nomadflow.boltz.data.sample.cluster.ClusterSampler
    task_sampler:
      _target_: nomadflow.runtime.training.task.TaskSampler
      task_list:
        - _target_: nomadflow.runtime.training.motif_scaffold.DistalSeparatedMotifScaffolding
          prob: 1.0
          t_sched: lognorm
          lognorm_mu: 0.0
          lognorm_sig: 1.0
          beta_p1: 1.9
          beta_p2: 1.0
          shift_time_scale: false
          t_min: 0.01
          t_max: 0.99
          p_is_unindexed: 1.0
          p_fix_tip: 0.0
          p_fix_bb: 0.0
          p_fix_all: 1.0
          name_override: motif_scaffold_unindexed_distal
          multi_motif_se3: true
          multi_motif_se3_trans_std: 14.0
          motif_t_lock: 0.5
          # Group geometry
          min_groups: 2
          max_groups: 3
          min_center_dist: 18.0
          min_inter_group_ca_dist: 8.0
          # Catalytic vs structural
          p_catalytic: 0.35
          catalytic_min_res: 3
          catalytic_max_res: 5
          small_fragment_shell_center_dist: 10.0
          small_fragment_shell_half_width: 3.0
          # Structural distal segments
          max_structural_fragments: 2
          min_seq_gap: 15
          structural_anchor_max_ca_dist: 14.0
          min_fragment_size: 3
          min_structural_res: 3
          max_structural_res: 10
          max_anchor_tries: 32
