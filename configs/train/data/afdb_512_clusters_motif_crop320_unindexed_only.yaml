# Motif scaffolding, unindexed motif copies only.
# Same crop/datasets as afdb_512_clusters_motif_crop320.yaml, but without the motif_scaffold_indexed branch.
#
# Paths to preprocessed Boltz data (each directory must contain manifest.json).
# The ENV: prefix is an environment variable name, not an OmegaConf interpolation.
#   export NOMADFLOW_DATA_FRAMEDIFF_BOLTZ=/path/to/framediff_boltz
#   export NOMADFLOW_DATA_AFDB_BOLTZ=/path/to/afdb_512_clusters_boltz
# See scripts/data/README.md
_target_: nomadflow.data.datasets.datamodule.TrainingDataset
max_crop_residues: 320
max_crop_rigids: 960
use_cropper: true
dataset_probs: [0.25, 0.75]
remove_mol_types:
  - "DNA"
  - "RNA"
  - "NONPOLYMER"
datasets:
  - _target_: nomadflow.data.datasets.dataset.MMCIFDataset
    data_dir: ENV:NOMADFLOW_DATA_FRAMEDIFF_BOLTZ
    data_sampler:
      _target_: nomadflow.boltz.data.sample.cluster.ClusterSampler
    task_sampler:
      _target_: nomadflow.runtime.training.task.TaskSampler
      task_list:
        - _target_: nomadflow.runtime.training.motif_scaffold.MixedMotifScaffolding
          prob: 1.0
          t_sched: lognorm
          lognorm_mu: 0.0
          lognorm_sig: 1.0
          beta_p1: 1.9
          beta_p2: 1.0
          shift_time_scale: false
          t_min: 0.01
          t_max: 0.99
          max_frac_res: 0.5
          max_num_res: 160
          p_is_unindexed: 1.0
          p_fix_tip: 0.35
          p_fix_bb: 0.35
          p_fix_all: 0.30
          name_override: motif_scaffold_unindexed
  - _target_: nomadflow.data.datasets.dataset.MMCIFDataset
    data_dir: ENV:NOMADFLOW_DATA_AFDB_BOLTZ
    data_sampler:
      _target_: nomadflow.boltz.data.sample.cluster.ClusterSampler
    task_sampler:
      _target_: nomadflow.runtime.training.task.TaskSampler
      task_list:
        - _target_: nomadflow.runtime.training.motif_scaffold.MixedMotifScaffolding
          prob: 1.0
          t_sched: lognorm
          lognorm_mu: 0.0
          lognorm_sig: 1.0
          beta_p1: 1.9
          beta_p2: 1.0
          shift_time_scale: false
          t_min: 0.01
          t_max: 0.99
          max_frac_res: 0.5
          max_num_res: 160
          p_is_unindexed: 1.0
          p_fix_tip: 0.35
          p_fix_bb: 0.35
          p_fix_all: 0.30
          name_override: motif_scaffold_unindexed
