# Per-segment motif groups for 7 non-catalytic multi-segment benchmark tasks.
# Each pdb_contigs segment is its own SE3 group (full fragment partition).
# 1BCF and 5YUI also include a 2-group split (adjacent segments merged by contig order).
# Compare with config_multi_motif_se3.yaml (single group) and config.yaml (fixed).
tasks:
- task: motif_scaffolding
  pdb: configs/sampling/protpardelle_motif_scaffolding/pdbs/1PRW.pdb
  pdb_contigs: A16-35,A52-71
  motif_groups: [["A16-35"], ["A52-71"]]
  contigs_idx: ''
  num_samples: 200
  total_length: 60-150
  name: 1PRW
  multi_motif_se3: true
  motif_rigid_mode: rigid_group_diffuse
  multi_motif_partition_mode: fragments
  multi_motif_max_groups: 8
  multi_motif_se3_trans_std: 12
  motif_t_lock: 0.5
